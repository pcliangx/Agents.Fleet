<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Agents.Fleet</title>
    <style>
      body {
        font-family: -apple-system, system-ui, sans-serif;
        margin: 0;
        padding: 2rem;
        color: #eee;
        background: #1e1e1e;
      }
      h1 { font-size: 1rem; font-weight: 600; }
      #status { font-family: ui-monospace, monospace; font-size: 0.85rem; opacity: 0.85; }
    </style>
  </head>
  <body>
    <h1>Agents.Fleet</h1>
    <div id="status">connecting…</div>
    <script>
      const api = window.agentsFleet;
      const el = document.getElementById("status");
      const poll = async () => {
        try {
          el.textContent = await api.getConnectionInfo();
        } catch (e) {
          el.textContent = "error: " + String(e);
        }
      };
      poll();
      setInterval(poll, 500);
    </script>
  </body>
</html>
