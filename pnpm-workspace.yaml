packages:
  - 'packages/*'
  - 'apps/*'

# pnpm 11 — `useNodeVersion` was removed; pnpm now sources Node from
# package.json `devEngines.runtime.version` (24.18.0). Because v11's devEngines
# onFail defaults to "warn" (silently broken — pnpm#11818), set
# `runtimeOnFail: download` here so pnpm actually downloads and runs that Node.
runtimeOnFail: download

# #36 — pnpm's side-effects cache restores postinstall-created symlinks as
# physical copies (upstream pnpm#12859, still unfixed in v11). electron is the
# only package allowed to build (allowBuilds below), and its framework symlinks
# are load-bearing (fuse verification edits Versions/Current while the loader
# resolves the top-level path), so build results must never be restored from
# the cache: postinstall re-runs on every install instead.
sideEffectsCache: false

# pnpm 11 `strictDepBuilds` defaults to true; version-pinned selectors (e.g.
# electron@43.2.0) can mismatch the resolved lockfile version and silently skip
# postinstall, so the electron entry drops the version to match all versions.
allowBuilds:
  electron: true
  esbuild@0.25.12: false
  esbuild@0.28.1: false
  node-pty@1.1.0: false
